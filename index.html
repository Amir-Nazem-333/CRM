<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آراد CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--bg1:#fff;--glass:#fff;--sh:rgba(16,24,40,.14);--ink:#161a22;--mut:#6b7280;--acc:#2f5fd0;--acc2:#eaf0fd;--g1:#2f5fd0;--g2:#4b7bec;--ok:#157347;--ok2:#e7f4ec;--warn:#946200;--warn2:#fcf2d9;--bad:#c0392b;--bad2:#fbeae8;--in:#f3f4f6;--line:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--bg1:#171a20;--glass:#171a20;--sh:rgba(0,0,0,.5);--ink:#e8eaee;--mut:#8b93a3;--acc:#7b9cff;--acc2:rgba(123,156,255,.13);--g1:#7b9cff;--g2:#7b9cff;--ok:#4cc38a;--ok2:rgba(76,195,138,.13);--warn:#e5b84a;--warn2:rgba(229,184,74,.13);--bad:#ef7b6f;--bad2:rgba(239,123,111,.13);--in:#1e222a;--line:#272c35}}
:root[data-theme="dark"]{--bg:#0e1013;--bg1:#171a20;--glass:#171a20;--sh:rgba(0,0,0,.5);--ink:#e8eaee;--mut:#8b93a3;--acc:#7b9cff;--acc2:rgba(123,156,255,.13);--g1:#7b9cff;--g2:#7b9cff;--ok:#4cc38a;--ok2:rgba(76,195,138,.13);--warn:#e5b84a;--warn2:rgba(229,184,74,.13);--bad:#ef7b6f;--bad2:rgba(239,123,111,.13);--in:#1e222a;--line:#272c35}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);font:400 14px/1.7 Vazirmatn,Tahoma,sans-serif}
.app{display:grid;grid-template-columns:228px 1fr;gap:20px;padding:20px;max-width:1440px;margin:0 auto}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:14px}
aside{padding:12px 10px;position:sticky;top:calc(20px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 40px);overflow:auto;display:flex;flex-direction:column;gap:1px}
.brand{font-weight:700;font-size:16px;padding:6px 10px 14px;display:flex;align-items:center;gap:10px}
.brand span{width:30px;height:30px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#fff;font-size:15px}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--mut);line-height:1.3}
.nb{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--mut);font:inherit;padding:7px 10px;border-radius:9px;cursor:pointer;text-align:start;width:100%}
.nb svg{flex:none}.nb:hover{background:var(--in);color:var(--ink)}.nb.on{background:var(--acc2);color:var(--acc);font-weight:600}
.nb i{font-style:normal;margin-inline-start:auto;background:var(--acc);color:#fff;border-radius:99px;padding:0 7px;font-size:11px}
.sep{height:1px;background:var(--line);margin:6px 4px}
.me{margin-top:auto;padding:10px 4px 2px}
main{min-width:0}
.hdr{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:18px;position:relative;z-index:6}
.gs{position:relative;flex:1;max-width:400px}.gsr{position:absolute;top:110%;inset-inline:0;padding:6px;display:none;z-index:9;box-shadow:0 12px 30px var(--sh)}.gsr.on{display:block}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}.ph h1{font-size:20px;margin:0 0 0 auto;font-weight:700;margin-inline-end:auto}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{padding:18px}.fw{grid-column:1/-1}
h2{font-size:14px;margin:0 0 12px;font-weight:600}
.kpi{padding:14px 16px}button.kpi{text-align:start;font:inherit;color:inherit;cursor:pointer;display:block;width:100%}button.kpi.on{border-color:var(--acc);background:var(--acc2)}[hidden]{display:none!important}#selbar{background:var(--acc2);border-radius:10px;padding:6px 12px}.kpi .ico{display:none}.kpi b{display:block;font-size:21px;font-weight:700;line-height:1.4}.kpi span{color:var(--mut);font-size:12.5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:7px 11px;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc2)}
textarea{resize:vertical}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:10px;padding:6px 14px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--in)}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:500}.btn.p:hover{filter:brightness(1.08)}
.btn.s{padding:3px 11px;font-size:13px}.btn.d{color:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{border:0;background:none;color:var(--mut);width:30px;height:30px;border-radius:8px;cursor:pointer;display:inline-grid;place-items:center}
.ib:hover{background:var(--in);color:var(--acc)}.ib.d:hover{background:var(--bad2);color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.row.e{justify-content:flex-end}.sp{margin-inline-start:auto}
.li{display:flex;gap:12px;align-items:center;padding:11px 8px;border-bottom:1px solid var(--line)}
.li:last-child{border:0}.li:hover{background:var(--in)}
.li .m{flex:1;min-width:0}.li small,.mut{color:var(--mut)}.li .a{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--acc2);color:var(--acc);font-weight:700;flex:none;overflow:hidden}
.av.ok{background:var(--ok2);color:var(--ok)}.av.b{background:var(--bad2);color:var(--bad)}.av.w{background:var(--warn2);color:var(--warn)}
.av img{width:100%;height:100%;object-fit:cover}
.chip{display:inline-block;border-radius:7px;padding:0 8px;font-size:12px;background:var(--acc2);color:var(--acc);white-space:nowrap}
.chip.ok{background:var(--ok2);color:var(--ok)}.chip.w{background:var(--warn2);color:var(--warn)}.chip.b{background:var(--bad2);color:var(--bad)}.chip.m{background:var(--in);color:var(--mut)}
.state{text-align:center;color:var(--mut);padding:34px 10px}.state.err{color:var(--bad)}
.sk{height:52px;border-radius:10px;margin:8px 0;background:linear-gradient(90deg,var(--in),var(--bg),var(--in));background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tb>*{width:auto;min-width:125px}.tb .q{flex:1;min-width:200px}
.pgn{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px}
.bars{display:flex;gap:10px;align-items:flex-end;height:170px;padding-top:10px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mut)}
.bars i{width:100%;max-width:44px;border-radius:6px 6px 2px 2px;background:var(--acc);opacity:.85;min-height:3px}
.hb{display:flex;gap:10px;align-items:center;margin:8px 0}.hb span{width:120px;font-size:13px}.hb .t{flex:1;height:7px;border-radius:9px;background:var(--in);overflow:hidden}.hb .t i{display:block;height:100%;background:var(--acc);border-radius:9px}
.tl{border-inline-start:1px solid var(--line);margin-inline-start:6px;padding-inline-start:16px}.tl>div{position:relative;padding-bottom:12px}.tl>div::before{content:"";position:absolute;inset-inline-start:-20px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin:12px 0;border-bottom:1px solid var(--line)}.tabs button{border:0;border-bottom:2px solid transparent;background:none;color:var(--mut);font:inherit;padding:7px 12px;cursor:pointer;white-space:nowrap}.tabs button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;font-size:13px}.tbl th{color:var(--mut);font-weight:500}
#bd{position:fixed;inset:0;background:rgba(10,12,18,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}#bd.on{opacity:1;pointer-events:auto}
#drw{position:fixed;top:0;bottom:0;left:0;width:min(640px,100vw);transform:translateX(-104%);transition:transform .25s ease;z-index:41;overflow:auto;padding:20px;border-radius:0 16px 16px 0;background:var(--bg)}#drw.on{transform:none}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg1);color:var(--ink);width:min(580px,94vw);max-height:92vh;padding:20px;font:inherit}
dialog[open]{animation:pop .18s ease}@keyframes pop{from{opacity:0;transform:translateY(8px)}}
dialog::backdrop{background:rgba(10,12,18,.45)}
dialog h3{margin:0 0 10px;font-size:17px}.mb{max-height:64vh;overflow:auto;padding:2px}
label.f{display:block;margin:10px 0 3px;color:var(--mut);font-size:12.5px}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto}
.dp{position:relative}.dp input{cursor:pointer;padding-inline-end:30px}.dp .x{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px}
.pop{position:fixed;z-index:100;width:288px;padding:12px;background:var(--bg1);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px var(--sh)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cal b{font-size:11px;color:var(--mut);font-weight:500}.cal button{border:0;background:none;color:var(--ink);font:inherit;padding:5px 0;border-radius:8px;cursor:pointer}.cal button:hover{background:var(--in)}.cal .sel{background:var(--acc);color:#fff}.cal .tod{outline:1px solid var(--acc)}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;margin-top:6px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(10px);padding:9px 20px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:200;background:var(--ink);color:var(--bg1)}#toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:960px){.app{grid-template-columns:1fr;padding:10px}aside{position:static;flex-direction:row;overflow-x:auto;padding:6px;max-height:none}.brand,.me,.sep{display:none}.nb{width:auto;white-space:nowrap}.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}.li{flex-wrap:wrap}}
@media print{aside,.hdr,#drw,#bd,#toast,.noprint,.ph,.mb~.row{display:none!important}main{display:none}dialog[open]{position:static;width:100%;max-height:none;border:0}body{background:#fff}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app"><aside class="glass" id="nav"></aside><div><div class="glass hdr" id="hdr"></div><main id="main"></main></div></div>
<div id="bd"></div><div id="drw" class="glass"></div>
<dialog id="dlg"></dialog><dialog id="cfm"></dialog><div id="toast" role="status"></div>
<script>
/* =====================================================================
 UI → Service → dataProvider → LocalStorageProvider | ApiProvider
 فقط StorageAdapter به localStorage دست می‌زند. اتصال بک‌اند: تنظیمات ← حالت «سرور» + apiBaseUrl
 قرارداد: GET /{entity}?search&page&limit&sortBy&sortOrder&filters=JSON  |  GET/PUT/DELETE /{entity}/:id  |  POST /{entity}
 پاسخ: {success,data,message,meta}   |   POST /messages/send   |   POST /ai/compose
 ===================================================================== */
const $=s=>document.querySelector(s);
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Math.random().toString(36).slice(2)+Date.now().toString(36);
const now=()=>new Date().toISOString();
const ok=(data,meta=null)=>({success:true,data,message:null,meta}),fail=message=>({success:false,data:null,message});
const norm=s=>String(s??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const ENT=['customers','products','calls','followups','messages','requests','activities','users','templates','invoices','stockmoves'];

/* ---------- ذخیره‌سازی و تنظیمات ---------- */
const StorageAdapter={mem:{},cache:{},dirty:new Set(),timer:null,
  get(k,d=[]){if(k in this.cache)return this.cache[k];let r=d;try{const v=localStorage.getItem('arad_'+k);if(v)r=JSON.parse(v)}catch(e){r=this.mem[k]??d}this.cache[k]=r;return r},
  save(k,v){this.cache[k]=v;this.dirty.add(k);if(!this.timer)this.timer=setTimeout(()=>this.flush(),60)},
  flush(){clearTimeout(this.timer);this.timer=null;for(const k of this.dirty){try{localStorage.setItem('arad_'+k,JSON.stringify(this.cache[k]))}catch(e){this.mem[k]=this.cache[k];if(!this.warned){this.warned=1;toast('ذخیره‌سازی مرورگر در دسترس یا کافی نیست؛ داده‌ها فقط تا بستن صفحه می‌مانند.')}}}this.dirty.clear()}};
addEventListener('beforeunload',()=>StorageAdapter.flush());addEventListener('storage',e=>{if(e.key&&e.key.startsWith('arad_'))delete StorageAdapter.cache[e.key.slice(5)]});
const DEFAULTS={mode:'local',apiBaseUrl:'',timeout:10000,token:'',company:'آراد',phone:'',payInfo:'',taxRate:0,theme:'auto',meId:'',deepLinks:{eitaa:'',rubika:''},
  reminder:{enabled:false,channel:'sms',everyDays:7,minAmount:0,minAge:0,hFrom:8,hTo:20,templateId:'',body:'سلام {name} عزیز، وقت بخیر. طبق حساب ما مبلغ {balance} از شما معوق است ({days} روز). لطفاً در اولین فرصت جهت تسویه اقدام فرمایید.\n{payinfo}\n{company}'}};
const Settings={get(){const st=StorageAdapter.get('settings',{});return{...DEFAULTS,...st,deepLinks:{...DEFAULTS.deepLinks,...st.deepLinks},reminder:{...DEFAULTS.reminder,...st.reminder}}},save:s=>StorageAdapter.save('settings',s)};

/* ---------- Providerها ---------- */
const SEARCH={customers:['firstName','lastName','companyName','phone','city','notes'],products:['name','code','category','description'],calls:['summary','outcome'],followups:['title','description','result'],messages:['body'],requests:['note'],activities:['title'],users:['name'],templates:['title','body','category'],invoices:['no','finalNo','note'],stockmoves:['note']};
const OPS={gt:(a,x)=>a>x,gte:(a,x)=>a>=x,lt:(a,x)=>a<x,lte:(a,x)=>a<=x,ne:(a,x)=>x===null?a!=null:a!==x,eq:(a,x)=>x===null?a==null:a===x,has:(a,x)=>Array.isArray(a)&&a.includes(x)};
const cmp=(r,k,v)=>v&&typeof v==='object'?Object.entries(v).every(([o,x])=>!!OPS[o]&&OPS[o](r[k],x)):r[k]===v;
const LocalStorageProvider={
  async get(e,p={}){try{const{search,filters={},sortBy='createdAt',sortOrder='desc',page=1,limit=0}=p;let rows=StorageAdapter.get(e).filter(r=>!r.deletedAt);
    if(search){const q=norm(search).toLowerCase();rows=rows.filter(r=>(SEARCH[e]||[]).some(f=>norm(r[f]).toLowerCase().includes(q)))}
    rows=rows.filter(r=>Object.entries(filters).every(([k,v])=>v==null||v===''||cmp(r,k,v)));
    rows.sort((a,b)=>(a[sortBy]>b[sortBy]?1:a[sortBy]<b[sortBy]?-1:0)*(sortOrder==='asc'?1:-1));
    const total=rows.length;if(limit)rows=rows.slice((page-1)*limit,page*limit);return ok(rows,{total,page,limit})}catch(x){return fail('خطا در دریافت اطلاعات')}},
  async getById(e,id){const r=StorageAdapter.get(e).find(x=>x.id===id&&!x.deletedAt);return r?ok(r):fail('رکورد پیدا نشد')},
  async create(e,d){try{const rows=StorageAdapter.get(e),r={...d,id:uuid(),createdAt:d.createdAt||now(),updatedAt:now(),deletedAt:null};rows.push(r);StorageAdapter.save(e,rows);return ok(r)}catch(x){return fail('خطا در ثبت اطلاعات')}},
  async update(e,id,d){const rows=StorageAdapter.get(e),i=rows.findIndex(x=>x.id===id);if(i<0)return fail('رکورد پیدا نشد');rows[i]={...rows[i],...d,id,updatedAt:now()};StorageAdapter.save(e,rows);return ok(rows[i])},
  async delete(e,id){StorageAdapter.save(e,StorageAdapter.get(e).filter(x=>x.id!==id));return ok(true)}, // Soft Delete: به‌جای حذف، deletedAt را ست کنید
  async action(){return ok({local:true})}};
const ApiProvider={
  async req(m,path,body){const s=Settings.get(),c=new AbortController(),t=setTimeout(()=>c.abort(),s.timeout);
    try{const r=await fetch(s.apiBaseUrl+path,{method:m,signal:c.signal,headers:{'Content-Type':'application/json',...(s.token?{Authorization:'Bearer '+s.token}:{})},body:body?JSON.stringify(body):undefined});const j=r.status===204?{}:await r.json();if(!r.ok)return fail(j.message||'خطای سرور ('+r.status+')');return j.success!==undefined?j:ok(j)}
    catch(x){return fail(x.name==='AbortError'?'پاسخی از سرور دریافت نشد':'ارتباط با سرور برقرار نشد')}finally{clearTimeout(t)}},
  get(e,p={}){const q=new URLSearchParams();for(const k of['search','page','limit','sortBy','sortOrder'])if(p[k])q.set(k,p[k]);if(p.filters&&Object.keys(p.filters).length)q.set('filters',JSON.stringify(p.filters));return this.req('GET','/'+e+'?'+q)},
  getById(e,id){return this.req('GET','/'+e+'/'+id)},create(e,d){return this.req('POST','/'+e,d)},update(e,id,d){return this.req('PUT','/'+e+'/'+id,d)},delete(e,id){return this.req('DELETE','/'+e+'/'+id)},action(p,b){return this.req('POST',p,b)}};
const dataProvider=new Proxy({},{get:(_,k)=>(Settings.get().mode==='api'?ApiProvider:LocalStorageProvider)[k]});

/* ---------- Serviceها ---------- */
const svc=(e,x={})=>({getAll:p=>dataProvider.get(e,p),getById:id=>dataProvider.getById(e,id),create:d=>dataProvider.create(e,d),update:(id,d)=>dataProvider.update(e,id,d),delete:id=>dataProvider.delete(e,id),search:q=>dataProvider.get(e,typeof q==='string'?{search:q}:q),...x});
const ProductService=svc('products'),CallService=svc('calls'),UserService=svc('users'),TemplateService=svc('templates'),MessageService0=svc('messages');
const CustomerService=svc('customers',{async deleteCascade(id){const r=await dataProvider.delete('customers',id);for(const e of['calls','followups','messages','requests','activities','invoices']){const l=await dataProvider.get(e,{filters:{customerId:id}});for(const x of l.data||[])await dataProvider.delete(e,x.id)}return r}});
const FollowUpService=svc('followups',{complete:(id,result)=>dataProvider.update('followups',id,{status:'done',result,completedAt:now()}),reschedule:(id,dueAt)=>dataProvider.update('followups',id,{dueAt,status:'open'})});
const RequestService=svc('requests',{changeStatus:(id,status)=>dataProvider.update('requests',id,{status})});
const ActivityService=svc('activities',{getByCustomerId:(customerId,p={})=>dataProvider.get('activities',{...p,filters:{customerId}})});
const InvoiceService=svc('invoices'),StockMoveService=svc('stockmoves');
const SV={customers:CustomerService,products:ProductService,calls:CallService,followups:FollowUpService,messages:MessageService0,requests:RequestService,activities:ActivityService,users:UserService,templates:TemplateService,invoices:InvoiceService,stockmoves:StockMoveService};
const NotificationService={getDue:()=>FollowUpService.getAll({filters:{status:'open',dueAt:{lte:eod()}}})};
const AccountingService={getBalance:async id=>{const r=await CustomerService.getById(id);return r.success?ok({balance:r.data.balance}):r}}; // نقطه‌ی اتصال محک
const log=(customerId,type,title)=>ActivityService.create({customerId,type,title});

/* ---------- احراز هویت و دسترسی ---------- */
const AuthService={get user(){return StorageAdapter.get('users').find(u=>u.id===Settings.get().meId)||{id:'demo',name:'مدیر',role:'admin'}}};
const DENY=['users.edit','users.delete','customers.delete','products.delete','settings.edit','templates.delete'];
const can=p=>{const r=AuthService.user.role;return r==='admin'||(r==='viewer'?p.endsWith('.view'):!DENY.includes(p))};

/* ---------- AI و کانال‌های پیام ---------- */
const AIService={async compose(c,items,tone){if(Settings.get().mode==='api'){const r=await dataProvider.action('/ai/compose',{customer:c,products:items,tone});if(r.success&&r.data?.text)return r}return ok({text:composeLocal(c,items,tone)})}};
const fillU=(t,to,text)=>t.replace('{phone}',encodeURIComponent(to)).replace('{text}',encodeURIComponent(text));
const copy=async t=>{try{await navigator.clipboard.writeText(t)}catch(e){}};
const Channels={ // کانال جدید = یک آیتم جدید
  sms:{label:'پیامک',async local(to,text){const a=document.createElement('a');a.href='sms:'+to+'?body='+encodeURIComponent(text);a.click();return 'برنامه‌ی پیامک باز شد'}},
  eitaa:{label:'ایتا',async local(to,text){const t=Settings.get().deepLinks.eitaa;if(t){window.open(fillU(t,to,text),'_blank');return 'ایتا باز شد'}await copy(text);window.open('https://web.eitaa.com','_blank');return 'متن کپی شد؛ در ایتا بچسبانید'}},

  async create(d){if(!can('invoices.edit'))return fail('دسترسی ندارید');const all=(await InvoiceService.getAll()).data||[],n=Math.max(1000,...all.map(i=>+String(i.no).replace(/\D/g,'')))+1;totals(d);
