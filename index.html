<style>

<dialog id="dlg"></dialog><dialog id="cfm"></dialog><div id="toast" role="status"></div><div id="login" role="main"></div>
<script>
/* =====================================================================
 UI → Service → dataProvider → LocalStorageProvider | ApiProvider
 فقط StorageAdapter به localStorage دست می‌زند. اتصال بک‌اند: تنظیمات ← حالت «سرور» + apiBaseUrl
 قرارداد: GET /{entity}?search&page&limit&sortBy&sortOrder&filters=JSON  |  GET/PUT/DELETE /{entity}/:id  |  POST /{entity}
 پاسخ: {success,data,message,meta}   |   POST /messages/send   |   POST /ai/compose
 ===================================================================== */
const $=s=>document.querySelector(s);
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Math.random().toString(36).slice(2)+Date.now().toString(36);
const now=()=>new Date().toISOString();
const ok=(data,meta=null)=>({success:true,data,message:null,meta}),fail=message=>({success:false,data:null,message});
const norm=s=>String(s??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[ۀة]/g,'ه');
const fold=s=>norm(s).replace(/[\u200c\u200f\u064b-\u065f]/g,'').toLowerCase();
const ENT=['customers','products','calls','followups','messages','requests','activities','users','templates','invoices','stockmoves','accounts'];

/* ---------- ذخیره‌سازی و تنظیمات ---------- */
const StorageAdapter={mem:{},cache:{},dirty:new Set(),timer:null,
  get(k,d=[]){if(k in this.cache)return this.cache[k];let r=d;try{const v=localStorage.getItem('arad_'+k);if(v)r=JSON.parse(v)}catch(e){r=this.mem[k]??d}this.cache[k]=r;return r},
  save(k,v){this.cache[k]=v;this.dirty.add(k);if(!this.timer)this.timer=setTimeout(()=>this.flush(),60)},
  flush(){clearTimeout(this.timer);this.timer=null;for(const k of this.dirty){try{localStorage.setItem('arad_'+k,JSON.stringify(this.cache[k]))}catch(e){this.mem[k]=this.cache[k];if(!this.warned){this.warned=1;toast('ذخیره‌سازی مرورگر در دسترس یا کافی نیست؛ داده‌ها فقط تا بستن صفحه می‌مانند.')}}}this.dirty.clear()}};
addEventListener('beforeunload',()=>StorageAdapter.flush());addEventListener('storage',e=>{if(e.key&&e.key.startsWith('arad_'))delete StorageAdapter.cache[e.key.slice(5)]});
const DEFAULTS={mode:'local',apiBaseUrl:'',timeout:10000,token:'',company:'آراد',phone:'',address:'',ecoCode:'',nationalId:'',postal:'',logo:'',stamp:'',invNote:'',payInfo:'',taxRate:0,theme:'auto',meId:'',deepLinks:{eitaa:'',rubika:''},pdfLibs:{h2c:'',pdf:''},
  reminder:{enabled:false,channel:'sms',everyDays:7,minAmount:0,minAge:0,hFrom:8,hTo:20,templateId:'',accountIds:[],body:'سلام {name} عزیز، وقت بخیر. طبق حساب ما مبلغ {balance} از شما معوق است ({days} روز). لطفاً در اولین فرصت جهت تسویه اقدام فرمایید.\n{payinfo}\n{company}'}};
const Settings={get(){const st=StorageAdapter.get('settings',{});return{...DEFAULTS,...st,deepLinks:{...DEFAULTS.deepLinks,...st.deepLinks},pdfLibs:{...DEFAULTS.pdfLibs,...st.pdfLibs},reminder:{...DEFAULTS.reminder,...st.reminder}}},save:s=>StorageAdapter.save('settings',s)};

/* ---------- Providerها ---------- */
const SEARCH={customers:['firstName','lastName','companyName','phone','city','notes'],products:['name','code','category','description'],calls:['customerName','summary','outcome'],followups:['customerName','title','description','result'],messages:['customerName','body'],requests:['customerName','note'],activities:['customerName','title'],users:['name'],templates:['title','body','category'],invoices:['customerName','no','finalNo','note'],stockmoves:['note'],accounts:['title','bank','holder']};
const CUST_REL=['calls','followups','messages','requests','activities','invoices'];
const OPS={gt:(a,x)=>a>x,gte:(a,x)=>a>=x,lt:(a,x)=>a<x,lte:(a,x)=>a<=x,ne:(a,x)=>x===null?a!=null:a!==x,eq:(a,x)=>x===null?a==null:a===x,has:(a,x)=>Array.isArray(a)&&a.includes(x),in:(a,x)=>Array.isArray(x)&&x.includes(a),hasAny:(a,x)=>Array.isArray(a)&&Array.isArray(x)&&x.some(i=>a.includes(i))};
const cmp=(r,k,v)=>Array.isArray(v)?v.every(x=>cmp(r,k,x)):v&&typeof v==='object'?Object.entries(v).every(([o,x])=>!!OPS[o]&&OPS[o](r[k],x)):r[k]===v;
const NOSCOPE=['users','products','templates','accounts','stockmoves'];
function scopeOf(e){const u=AuthService.user;if(u.role!=='sales'||!Settings.get().ownOnly||NOSCOPE.includes(e))return null;
  const cm=e==='customers'?null:new Map(StorageAdapter.get('customers').map(c=>[c.id,c]));
  return r=>{if(e==='customers')return r.assignedTo===u.id||r.createdBy===u.id;if(r.createdBy===u.id||r.assignee===u.id)return true;const c=r.customerId?cm.get(r.customerId):null;return !!c&&(c.assignedTo===u.id||c.createdBy===u.id)}}
const LocalStorageProvider={
  async get(e,p={}){try{const{search,filters={},sortBy='createdAt',sortOrder='desc',page=1,limit=0}=p;let rows=StorageAdapter.get(e).filter(r=>!r.deletedAt);{const sc=scopeOf(e);if(sc)rows=rows.filter(sc)}
    if(search){const terms=fold(search).split(/\s+/).filter(Boolean),F=SEARCH[e]||[];rows=rows.filter(r=>{const hay=F.map(f=>fold(r[f])).join(' ');return terms.every(t=>hay.includes(t))})}
    rows=rows.filter(r=>Object.entries(filters).every(([k,v])=>v==null||v===''||cmp(r,k,v)));
    rows.sort((a,b)=>(a[sortBy]>b[sortBy]?1:a[sortBy]<b[sortBy]?-1:0)*(sortOrder==='asc'?1:-1));
    const total=rows.length;if(limit)rows=rows.slice((page-1)*limit,page*limit);return ok(rows,{total,page,limit})}catch(x){return fail('خطا در دریافت اطلاعات')}},
  async getById(e,id){const r=StorageAdapter.get(e).find(x=>x.id===id&&!x.deletedAt),sc=scopeOf(e);return r&&(!sc||sc(r))?ok(r):fail('رکورد پیدا نشد')},
  async create(e,d){try{const rows=StorageAdapter.get(e),r={...d,id:uuid(),createdAt:d.createdAt||now(),updatedAt:now(),deletedAt:null};rows.push(r);StorageAdapter.save(e,rows);return ok(r)}catch(x){return fail('خطا در ثبت اطلاعات')}},
  async update(e,id,d){const rows=StorageAdapter.get(e),i=rows.findIndex(x=>x.id===id);if(i<0)return fail('رکورد پیدا نشد');rows[i]={...rows[i],...d,id,updatedAt:now()};StorageAdapter.save(e,rows);return ok(rows[i])},
  async delete(e,id){StorageAdapter.save(e,StorageAdapter.get(e).filter(x=>x.id!==id));return ok(true)}, // Soft Delete: به‌جای حذف، deletedAt را ست کنید
  async action(){return ok({local:true})}};
const ApiProvider={
  async req(m,path,body){const s=Settings.get(),c=new AbortController(),t=setTimeout(()=>c.abort(),s.timeout);
    try{const r=await fetch(s.apiBaseUrl+path,{method:m,signal:c.signal,headers:{'Content-Type':'application/json',...((AuthService.token||s.token)?{Authorization:'Bearer '+(AuthService.token||s.token)}:{})},body:body?JSON.stringify(body):undefined});if(r.status===401&&path!=='/auth/login'){AuthService.expire();return fail('نشست شما منقضی شده؛ دوباره وارد شوید')}const j=r.status===204?{}:await r.json();if(!r.ok)return fail(j.message||'خطای سرور ('+r.status+')');return j.success!==undefined?j:ok(j)}
    catch(x){return fail(x.name==='AbortError'?'پاسخی از سرور دریافت نشد':'ارتباط با سرور برقرار نشد')}finally{clearTimeout(t)}},
  get(e,p={}){const q=new URLSearchParams();for(const k of['search','page','limit','sortBy','sortOrder'])if(p[k])q.set(k,p[k]);if(p.filters&&Object.keys(p.filters).length)q.set('filters',JSON.stringify(p.filters));return this.req('GET','/'+e+'?'+q)},
  getById(e,id){return this.req('GET','/'+e+'/'+id)},create(e,d){return this.req('POST','/'+e,d)},update(e,id,d){return this.req('PUT','/'+e+'/'+id,d)},delete(e,id){return this.req('DELETE','/'+e+'/'+id)},action(p,b){return this.req('POST',p,b)}};
const dataProvider=new Proxy({},{get:(_,k)=>(Settings.get().mode==='api'?ApiProvider:LocalStorageProvider)[k]});

/* ---------- Serviceها ---------- */
const svc=(e,x={})=>({getAll:p=>dataProvider.get(e,p),getById:id=>dataProvider.getById(e,id),create:async d=>{if(CUST_REL.includes(e)&&d.customerId&&!d.customerName){const c=(await dataProvider.getById('customers',d.customerId)).data;if(c)d={...d,customerName:name(c),customerCity:c.city||''}}const u=AuthService.user;if(u.id&&!d.createdBy)d={...d,createdBy:u.id,createdByName:u.name};return dataProvider.create(e,d)},update:(id,d)=>dataProvider.update(e,id,AuthService.user.id?{...d,updatedBy:AuthService.user.id}:d),delete:id=>dataProvider.delete(e,id),search:q=>dataProvider.get(e,typeof q==='string'?{search:q}:q),...x});
const ProductService=svc('products'),CallService=svc('calls'),TemplateService=svc('templates'),MessageService0=svc('messages');
/* ---- رمزنگاری رمز عبور (SHA-256 خالص جاوااسکریپت؛ مستقل از HTTPS) ---- */
function sha256(m){const K=[1116352408,1899447441,3049323471,3921009573,961987163,1508970993,2453635748,2870763221,3624381080,310598401,607225278,1426881987,1925078388,2162078206,2614888103,3248222580,3835390401,4022224774,264347078,604807628,770255983,1249150122,1555081692,1996064986,2554220882,2821834349,2952996808,3210313671,3336571891,3584528711,113926993,338241895,666307205,773529912,1294757372,1396182291,1695183700,1986661051,2177026350,2456956037,2730485921,2820302411,3259730800,3345764771,3516065817,3600352804,4094571909,275423344,430227734,506948616,659060556,883997877,958139571,1322822218,1537002063,1747873779,1955562222,2024104815,2227730452,2361852424,2428436474,2756734187,3204031479,3329325298],h=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225].slice(),l=m.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n);b.set(m);b[l]=128;const dv=new DataView(b.buffer);dv.setUint32(n-4,l*8>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
 const w=new Uint32Array(64),rr=(x,s)=>(x>>>s)|(x<<(32-s));
 for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(c,17)^rr(c,19)^(c>>>10)))>>>0}
  let [a,bb,c,d,e,f,g,hh]=h;for(let i=0;i<64;i++){const t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])>>>0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&bb)^(a&c)^(bb&c)))>>>0;hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0}
  h[0]=(h[0]+a)>>>0;h[1]=(h[1]+bb)>>>0;h[2]=(h[2]+c)>>>0;h[3]=(h[3]+d)>>>0;h[4]=(h[4]+e)>>>0;h[5]=(h[5]+f)>>>0;h[6]=(h[6]+g)>>>0;h[7]=(h[7]+hh)>>>0}
 const out=new Uint8Array(32),ov=new DataView(out.buffer);h.forEach((x,i)=>ov.setUint32(i*4,x));return out}
const utf8=t=>{const e=unescape(encodeURIComponent(String(t))),b=new Uint8Array(e.length);for(let i=0;i<e.length;i++)b[i]=e.charCodeAt(i);return b};
const hexOf=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
const randHex=n=>{const b=new Uint8Array(n);if(typeof crypto!=='undefined'&&crypto.getRandomValues)crypto.getRandomValues(b);else for(let i=0;i<n;i++)b[i]=Math.floor(Math.random()*256);return hexOf(b)};
const hashPw=(pw,salt)=>{let h=sha256(utf8(salt+':'+pw));const sb=utf8(salt);for(let i=0;i<8000;i++){const x=new Uint8Array(32+sb.length);x.set(h);x.set(sb,32);h=sha256(x)}return 's1:'+hexOf(h)};
const cleanUser=t=>norm(t).trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');
const securePw=async d=>{d={...d};if(Settings.get().mode==='api'){if(!d.password)delete d.password;return d}
  if(d.password){const salt=randHex(16);d.salt=salt;d.passwordHash=hashPw(d.password,salt)}delete d.password;return d};
const UserService=svc('users',{async create(d){return dataProvider.create('users',await securePw(d))},async update(id,d){return dataProvider.update('users',id,await securePw(d))},
  async usage(id){let n=0;for(const e of[...CUST_REL,'customers']){const r=await dataProvider.get(e,{filters:{createdBy:id},limit:1});n+=r.meta?.total||0}return n}});
const CustomerService=svc('customers',{async update(id,d){const before=(await dataProvider.getById('customers',id)).data,r=await dataProvider.update('customers',id,d);
  if(r.success&&before&&(name(before)!==name(r.data)||(before.city||'')!==(r.data.city||''))){const nm=name(r.data),ct=r.data.city||'';for(const e of CUST_REL){const l=await dataProvider.get(e,{filters:{customerId:id}});for(const x of l.data||[])await dataProvider.update(e,x.id,{customerName:nm,customerCity:ct})}}return r},
  async deleteCascade(id){const r=await dataProvider.delete('customers',id);for(const e of['calls','followups','messages','requests','activities','invoices']){const l=await dataProvider.get(e,{filters:{customerId:id}});for(const x of l.data||[])await dataProvider.delete(e,x.id)}return r}});
const FollowUpService=svc('followups',{complete:(id,result)=>dataProvider.update('followups',id,{status:'done',result,completedAt:now()}),reschedule:(id,dueAt)=>dataProvider.update('followups',id,{dueAt,status:'open'})});
const RequestService=svc('requests',{changeStatus:(id,status)=>dataProvider.update('requests',id,{status})});
const ActivityService=svc('activities',{getByCustomerId:(customerId,p={})=>dataProvider.get('activities',{...p,filters:{customerId}})});
const InvoiceService=svc('invoices'),StockMoveService=svc('stockmoves');
let ACC=[];const AccountService=svc('accounts',{async getAll(p){const r=await dataProvider.get('accounts',p);if(r.success&&!(p&&(p.filters||p.search)))ACC=r.data;return r}});
const SV={customers:CustomerService,products:ProductService,calls:CallService,followups:FollowUpService,messages:MessageService0,requests:RequestService,activities:ActivityService,users:UserService,templates:TemplateService,invoices:InvoiceService,stockmoves:StockMoveService,accounts:AccountService};
const NotificationService={getDue:()=>FollowUpService.getAll({filters:{status:'open',dueAt:{lte:eod()},...(AuthService.user.role==='sales'?{assignee:AuthService.user.id}:{})}})};
const AccountingService={getBalance:async id=>{const r=await CustomerService.getById(id);return r.success?ok({balance:r.data.balance}):r}}; // نقطه‌ی اتصال محک
const log=(customerId,type,title)=>ActivityService.create({customerId,type,title});

/* ---------- احراز هویت و دسترسی ---------- */
const SESS='arad_session';
const DENY=['users.edit','users.delete','settings.edit','customers.delete','products.edit','products.delete','accounts.edit','accounts.delete','templates.delete','invoices.revert'];
const can=p=>{const r=AuthService.user.role;return r==='admin'||(r==='sales'&&!DENY.includes(p))};
const AuthService={cur:null,fails:0,lockUntil:0,
  get user(){return this.cur||{id:'',name:'',role:'guest'}},get token(){return this.cur?.token||''},
  needsSetup(){return Settings.get().mode!=='api'&&!StorageAdapter.get('users').some(u=>u.role==='admin'&&u.passwordHash)},
  persist(remember){try{const v=JSON.stringify({user:this.cur});sessionStorage.removeItem(SESS);localStorage.removeItem(SESS);(remember?localStorage:sessionStorage).setItem(SESS,v)}catch(e){}},
  async setup({name:nm,username,password}){if(!this.needsSetup())return fail('راه‌اندازی قبلاً انجام شده است');const u=cleanUser(username);
    if(!(nm||'').trim()||u.length<3)return fail('نام و نام کاربری (حداقل ۳ حرف انگلیسی یا عدد) را وارد کنید');if((password||'').length<6)return fail('رمز عبور حداقل ۶ کاراکتر باشد');
    const us=StorageAdapter.get('users'),adm=us.find(x=>x.role==='admin'&&!x.deletedAt);if(us.some(x=>x.username===u&&x!==adm))return fail('این نام کاربری برای کاربر دیگری ثبت شده است');
    const salt=randHex(16),patch={name:nm.trim(),username:u,salt,passwordHash:hashPw(password,salt),active:true};
    if(adm)Object.assign(adm,patch,{updatedAt:now()});else us.push({id:uuid(),role:'admin',phone:'',...patch,createdAt:now(),updatedAt:now(),deletedAt:null});
    StorageAdapter.save('users',us);return this.login(u,password,true)},
  async login(username,password,remember){const s=Settings.get();
    if(s.mode==='api'){const r=await ApiProvider.req('POST','/auth/login',{username,password});if(!r.success)return r;this.cur={...r.data.user,token:r.data.token};this.persist(remember);return ok(this.cur)}
    if(Date.now()<this.lockUntil)return fail('تلاش‌های ناموفق زیاد بود؛ '+Math.ceil((this.lockUntil-Date.now())/1000).toLocaleString('fa-IR')+' ثانیه صبر کنید');
    const u=cleanUser(username),us=StorageAdapter.get('users'),row=us.find(x=>x.username===u&&!x.deletedAt),good=!!row&&!!row.passwordHash&&row.active!==false&&hashPw(password||'',row.salt)===row.passwordHash;
    if(!good){if(++this.fails>=5){this.lockUntil=Date.now()+30000;this.fails=0}return fail(row&&row.passwordHash&&row.active===false?'این حساب غیرفعال شده است؛ با مدیر تماس بگیرید':'نام کاربری یا رمز عبور اشتباه است')}
    this.fails=0;row.lastLoginAt=now();StorageAdapter.save('users',us);this.cur={id:row.id,name:row.name,role:row.role,username:row.username};this.persist(remember);return ok(this.cur)},
  restore(){try{const raw=sessionStorage.getItem(SESS)||localStorage.getItem(SESS);if(!raw)return;const u=JSON.parse(raw).user;if(!u)return;
    if(Settings.get().mode==='api'){this.cur=u;return}const row=StorageAdapter.get('users').find(x=>x.id===u.id&&!x.deletedAt&&x.active!==false&&x.passwordHash);if(row)this.cur={id:row.id,name:row.name,role:row.role,username:row.username}}catch(e){}},
  logout(){this.cur=null;try{sessionStorage.removeItem(SESS);localStorage.removeItem(SESS)}catch(e){}},
  expire(){if(!this.cur)return;this.logout();toast('نشست شما پایان یافت؛ دوباره وارد شوید');showLogin()},
  async changePassword(oldPw,newPw){if((newPw||'').length<6)return fail('رمز جدید حداقل ۶ کاراکتر باشد');

function migrate(){const v=StorageAdapter.get('schema',0);if(v>=8)return;let noStock=0;
  if(v<5){const cs=StorageAdapter.get('customers');cs.forEach(c=>{c.ordersCount=c.ordersCount||0;c.totalPurchase=c.totalPurchase||0;c.lastPurchaseAt=c.lastPurchaseAt||null;c.reminderCount=c.reminderCount||0;c.lastReminderAt=c.lastReminderAt||null;c.debtCategory=c.debtCategory||'';c.city=c.city||'';if(c.balance>0&&!c.debtSince)c.debtSince=c.updatedAt||c.createdAt||now()});
    StorageAdapter.save('customers',cs);const ps=StorageAdapter.get('products');ps.forEach(p=>{if(p.stock==null){p.stock=0;p.minStock=0;p.low=true;noStock++}else if(p.low==null)p.low=p.stock<=(p.minStock||0)});StorageAdapter.save('products',ps)}
  const cm=new Map(StorageAdapter.get('customers').map(c=>[c.id,c]));
  if(v<7){for(const e of CUST_REL){const l=StorageAdapter.get(e);let ch=0;l.forEach(x=>{const c=cm.get(x.customerId);if(c&&(!x.customerName||x.customerCity==null)){x.customerName=x.customerName||name(c);x.customerCity=c.city||'';ch=1}});if(ch)StorageAdapter.save(e,l)}
    const st=StorageAdapter.get('settings',{});if(st.invNote&&/اعتبار این پیش.?فاکتور ۷ روز/.test(st.invNote)){st.invNote='';StorageAdapter.save('settings',st)}}
  const us=StorageAdapter.get('users');us.forEach(u=>{if(u.role==='viewer')u.role='sales';if(u.active==null)u.active=true;if(u.username===undefined)u.username=null});StorageAdapter.save('users',us);
  StorageAdapter.save('schema',8);if(noStock)setTimeout(()=>toast(noStock.toLocaleString('fa-IR')+' محصول موجودی اولیه نداشت؛ از صفحه‌ی «انبار» موجودی را ثبت کنید.'),1500)}
